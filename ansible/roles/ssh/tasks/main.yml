---
- name: Ensure deployment user exists
  ansible.builtin.user:
    name: devops
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Secure deployment SSH directory
  ansible.builtin.file:
    path: /home/devops/.ssh
    state: directory
    owner: devops
    group: devops
    mode: "0700"

- name: Install deployment public key before disabling passwords
  ansible.posix.authorized_key:
    user: devops
    state: present
    key: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') + '/.ssh/id_ed25519_devops_vm.pub') }}"
    manage_dir: false

- name: Configure noninteractive deployment sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/devops
    content: "devops ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Harden SSH after installing the deployment key
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      PermitEmptyPasswords no
      AllowUsers student devops
      X11Forwarding no
    owner: root
    group: root
    mode: "0644"
    validate: "sshd -t -f %s"
  notify: Restart SSH

- name: Allow management and web ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "80"]

- name: Set incoming firewall policy
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set outgoing firewall policy
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Enable firewall
  community.general.ufw:
    state: enabled
    logging: low
