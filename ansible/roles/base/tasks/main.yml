---
- name: Assert supported VM platform
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['distribution_version'] is version("24.04", "==")
      - ansible_facts['architecture'] == "aarch64"
    fail_msg: "Требуется Ubuntu Server 24.04 ARM64 для VM на Apple Silicon"

- name: Install base packages and remote module dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - openssh-server
      - ufw
      - python3-debian
      - python3-requests
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure official Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [stable]
    architectures: [arm64]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
